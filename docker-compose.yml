services:
  db:
    image: postgres:17
    container_name: personal-library-db
    environment:
      POSTGRES_DB: personal_library
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
